# Blueprint do Render. A aplicação web é exportada como site estático (modo demonstração).
services:
  - type: web
    name: cortex-web
    runtime: static
    branch: pre-prod
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cortex/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
